<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>勇者の旅路 第1章</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#090909;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;justify-content:center;min-height:100vh}
#app{width:min(100vw,760px);height:100vh;display:flex;flex-direction:column;background:#000}
header{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#161616;font-size:12px}
canvas{width:100%;flex:1;min-height:0;image-rendering:pixelated;background:#000}
#pad{padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#101010;display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{height:43px;color:#fff;background:#252525;border:2px solid #555;border-radius:7px;font:inherit;touch-action:manipulation}
button:active{background:#666}.d{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.d button{height:42px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.a{display:grid;grid-template-columns:1fr 1fr;gap:4px}
@media(min-width:600px){#pad{grid-template-columns:300px 1fr}.d button{height:48px}}
</style>
</head>
<body>
<div id="app">
<header><b>勇者の旅路 ― 第1章</b><span id="hud"></span></header>
<canvas id="g" width="320" height="240"></canvas>
<div id="pad">
 <div class="d"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button></div>
 <div class="a"><button data-k="ok">A 決定</button><button data-k="cancel">B 戻る</button><button data-k="menu">メニュー</button><button data-k="talk">話す/調べる</button></div>
</div>
</div>
<script>
const C=document.querySelector("#g"),X=C.getContext("2d");X.imageSmoothingEnabled=false;
const W=320,H=240,T=16;
let mode="title",msg="",msgT=0,menuPage=0,choice=0,battle=null;
const P={x:2,y:5,dir:"down",lv:1,xp:0,next:30,hp:34,maxhp:34,mp:10,maxmp:10,atk:7,def:4,gold:35,
 weapon:"たびびとの剣",armor:"布の服",items:["やくそう","やくそう"],party:[]};
const maps={
town:[
"####################","#..................#","#..TTT.............#","#..................#","#.....####.........#","#.....#............#","#.....#............#","#..................#","#..................#","####.###############",
"#..................#","#..................#","#.............TT...#","#..................#","#..................#","#..................#","####################"],
field:[
"####################","#..................#","#....####..........#","#....#.............#","#....#.............#","#..................#","#.........#####....#","#.........#........#","#.........#........#","####.#####.########",
"#..................#","#..####............#","#..................#","#............####..#","#..................#","####################"],
dungeon:[
"####################","#..................#","#.####.#####.#####.#","#.#....#...#.....#.#","#.#.##.#.#.#.###.#.#","#...##...#...#...#.#",
"###.##########.###.#","#..............#...#","#.##############.#.#","#.#............#.#.#",
"#.#.##########.#...#","#.#............####.#","#.############......#","#...................#","#...................#","####################"]
]};
let area="town";
const places={
"town,2,2":{name:"宿屋",type:"inn"},"town,3,2":{name:"武器屋",type:"weapon"},"town,4,2":{name:"道具屋",type:"item"},"town,14,12":{name:"王の城",type:"castle"},
"field,16,12":{name:"古い洞窟",type:"dungeon"},"dungeon,18,13":{name:"奥へ進む",type:"boss"}
};
const mons=[
{name:"ぷるん",hp:18,atk:5,def:2,xp:9,g:6},
{name:"おおねずみ",hp:25,atk:7,def:3,xp:13,g:9},
{name:"きのこ兵",hp:31,atk:8,def:4,xp:18,g:12},
{name:"石ころ魔人",hp:44,atk:10,def:6,xp:27,g:17}
];
function say(s){msg=s;msgT=190}
function map(){return maps[area]}
function pass(x,y){let m=map();return m[y]&&m[y][x]&&m[y][x]!=="#"}
function pk(){return `${area},${P.x},${P.y}`}
function move(dx,dy){
 if(mode!=="world")return;
 P.dir=dx<0?"left":dx>0?"right":dy<0?"up":"down";
 let nx=P.x+dx,ny=P.y+dy;
 if(!pass(nx,ny)){say("そこには進めない。");return}
 P.x=nx;P.y=ny;
 if(area==="field"&&Math.random()<.14)startBattle(false);
 if(area==="dungeon"&&Math.random()<.20)startBattle(false);
 if(places[pk()])say(places[pk()].name+"　Aで調べる");
}
function enter(){
 if(mode==="title"){mode="world";say("アルバルド王国。勇者は王の呼び出しを受けた。");return}
 if(mode==="world"){let q=places[pk()];if(!q){say("何もない。");return}
  if(q.type==="inn"){P.hp=P.maxhp;P.mp=P.maxmp;say("宿屋で休んだ。HPとMPが全回復！")}
  if(q.type==="weapon"){if(P.gold>=30){P.gold-=30;P.weapon="鉄の剣";P.atk+=5;say("鉄の剣を買った！ 攻撃力+5");}else say("「鉄の剣は30Gだよ」")}
  if(q.type==="item"){if(P.gold>=8){P.gold-=8;P.items.push("やくそう");say("やくそうを買った！")}else say("「8Gだよ」")}
  if(q.type==="castle"){say("王「西の古い洞窟を調べてほしい」");}
  if(q.type==="dungeon"){area="dungeon";P.x=2;P.y=1;say("古い洞窟へ入った……。");}
  if(q.type==="boss"){startBattle(true)}
 }}
function startBattle(boss){
 let e=boss?{name:"黒騎士ガルド",hp:95,atk:15,def:8,xp:100,g:120,boss:true}:{...mons[Math.floor(Math.random()*mons.length)]};
 battle={e,turn:"p"};mode="battle";choice=0;say(`${e.name}があらわれた！`);
}
function battleDo(n){
 if(!battle)return;
 if(n===0){
  let d=Math.max(1,P.atk+Math.floor(Math.random()*4)-battle.e.def);battle.e.hp-=d;say(`勇者の攻撃！ ${d}ダメージ！`);
 }else if(n===1){
  if(P.mp<3){say("MPが足りない！");return} P.mp-=3;let d=Math.min(P.maxhp-P.hp,13+Math.floor(Math.random()*7));P.hp+=d;say(`ホイミ！ HPが${d}回復した。`);
 }else if(n===2){
  let i=P.items.indexOf("やくそう");if(i<0){say("やくそうを持っていない！");return}P.items.splice(i,1);let d=Math.min(P.maxhp-P.hp,25);P.hp+=d;say(`やくそうを使った！ HPが${d}回復。`);
 }else{if(Math.random()<.7){mode="world";battle=null;say("うまく逃げ切った！");}else say("逃げられない！");return}
 if(battle.e.hp<=0){win();return}
 setTimeout(enemy,420);
}
function enemy(){if(!battle)return;let d=Math.max(1,battle.e.atk+Math.floor(Math.random()*3)-P.def);P.hp-=d;say(`${battle.e.name}の攻撃！ ${d}ダメージ！`);if(P.hp<=0){P.hp=1;area="town";P.x=2;P.y=5;mode="world";battle=null;say("力尽きた……。宿屋の前まで運ばれた。")}}
function win(){
 let e=battle.e;P.xp+=e.xp;P.gold+=e.g;let s=`${e.name}を倒した！ ${e.xp}EXP ${e.g}G`;
 if(P.xp>=P.next){P.xp-=P.next;P.next=Math.floor(P.next*1.45);P.lv++;P.maxhp+=8;P.maxmp+=3;P.hp=P.maxhp;P.mp=P.maxmp;P.atk+=2;P.def++;s+=`　レベル${P.lv}！`}
 if(e.boss){s="黒騎士を倒した！ 王国に平和が戻った！ 第1章クリア！";mode="ending"}
 else mode="world";battle=null;say(s);
}
function menu(){if(mode==="world")mode="menu";else if(mode==="menu")mode="world"}
function draw(){
 X.fillStyle="#000";X.fillRect(0,0,W,H);
 if(mode==="title")title(); else if(mode==="world")world(); else if(mode==="battle")fight(); else if(mode==="menu")menuDraw(); else ending();
 if(msgT>0){X.fillStyle="#090909";X.fillRect(8,188,304,44);X.strokeStyle="#fff";X.strokeRect(8,188,304,44);X.fillStyle="#fff";X.font="11px monospace";X.fillText(msg.slice(0,45),15,214)}
 document.querySelector("#hud").textContent=`Lv${P.lv} HP${P.hp}/${P.maxhp} MP${P.mp}/${P.maxmp} G${P.gold}`;
 requestAnimationFrame(draw);
}
function title(){X.fillStyle="#162b3c";X.fillRect(0,0,W,H);X.fillStyle="#fff";X.font="22px monospace";X.fillText("勇者の旅路",91,83);X.font="11px monospace";X.fillText("― 第1章　黒騎士の洞窟 ―",72,108);X.fillText("Aボタンで冒険を始める",83,165)}
function world(){
 let m=map();for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++){let ch=m[y][x];X.fillStyle=ch==="#"?"#344b30":(area==="dungeon"?"#55524b":((x+y)%2?"#89a95d":"#96b86a"));X.fillRect(x*T,y*T,T,T);if(ch==="T"){X.fillStyle="#a33";X.fillRect(x*T+3,y*T+4,10,11);X.fillStyle="#e7c56c";X.fillRect(x*T+5,y*T+1,6,4)}}
 if(area==="field"){X.fillStyle="#548fb4";X.fillRect(14*T,1*T,3*T,3*T)}
 let px=P.x*T,py=P.y*T;X.fillStyle="#efc7a0";X.fillRect(px+5,py+2,6,6);X.fillStyle="#2f408e";X.fillRect(px+3,py+8,10,6);X.fillStyle="#633d29";X.fillRect(px+5,py+1,6,3);
}
function fight(){X.fillStyle="#0b1020";X.fillRect(0,0,W,H);X.strokeStyle="#777";X.strokeRect(8,8,304,224);let e=battle.e;X.fillStyle="#fff";X.font="12px monospace";X.fillText(e.name,20,28);X.fillText(`HP ${Math.max(0,e.hp)}`,20,45);
 X.fillStyle=e.boss?"#8d5ad1":"#4da7d9";X.fillRect(135,68,e.boss?60:46,46);X.fillStyle="#fff";X.fillRect(145,78,6,6);X.fillRect(165,78,6,6);
 X.fillStyle="#fff";X.font="11px monospace";X.fillText("1 こうげき",28,154);X.fillText("2 ホイミ",28,174);X.fillText("3 やくそう",160,154);X.fillText("4 にげる",160,174);X.fillText("Aで実行　Bで逃げる",78,205)}
function menuDraw(){X.fillStyle="#101010";X.fillRect(55,24,210,190);X.strokeStyle="#fff";X.strokeRect(55,24,210,190);X.fillStyle="#fff";X.font="12px monospace";["ゆうしゃ","Lv "+P.lv,`HP ${P.hp}/${P.maxhp}`,`MP ${P.mp}/${P.maxmp}`,`EXP ${P.xp}/${P.next}`,`攻 ${P.atk}　守 ${P.def}`,`武器 ${P.weapon}`,`防具 ${P.armor}`,`道具 やくそう×${P.items.length}`].forEach((s,i)=>X.fillText(s,72,48+i*17));}
function ending(){X.fillStyle="#111b16";X.fillRect(0,0,W,H);X.fillStyle="#fff";X.font="20px monospace";X.fillText("第1章　完",105,95);X.font="11px monospace";X.fillText("勇者の旅は、まだ始まったばかりだ。",65,125);X.fillText("Bでタイトルへ",105,165)}
function key(k){
 if(k==="up")move(0,-1);else if(k==="down")move(0,1);else if(k==="left")move(-1,0);else if(k==="right")move(1,0);
 else if(k==="ok"){if(mode==="battle")battleDo(choice);else enter()}
 else if(k==="cancel"){if(mode==="battle")battleDo(3);else if(mode==="menu")mode="world";else if(mode==="ending")mode="title"}
 else if(k==="menu")menu();else if(k==="talk")enter();
}
document.querySelectorAll("button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();key(b.dataset.k)}));
window.addEventListener("keydown",e=>{let k={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",z:"ok",Enter:"ok",x:"cancel",Escape:"cancel",m:"menu" }[e.key];if(k){e.preventDefault();key(k)}});
setInterval(()=>{if(msgT>0)msgT--},50);
say("Aボタンで冒険を始めよう！");
draw();
</script>
</body>
</html>
