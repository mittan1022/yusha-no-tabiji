<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勇者の旅路 ― 第1章</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font-family:sans-serif}
header{height:58px;padding:17px 20px;background:#171717;font-weight:bold;font-size:18px}
#wrap{max-width:760px;margin:auto}canvas{display:block;width:100%;height:auto;background:#102030}
.controls{background:#111;padding:14px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
button{background:#252525;color:white;border:2px solid #666;border-radius:10px;min-height:58px;font-size:17px;font-weight:bold}
.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
.a{grid-column:4;grid-row:1}.b{grid-column:5;grid-row:1}.menu{grid-column:4;grid-row:2}.talk{grid-column:5;grid-row:2}
.hint{text-align:center;background:#111;color:#aaa;padding:8px;font-size:12px}
</style></head><body><div id="wrap">
<header>勇者の旅路 ― 第1章</header>
<canvas id="game" width="640" height="400"></canvas>
<div class="controls">
<button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button>
<button class="a" data-k="Enter">A 決定</button><button class="b" data-k="Escape">B 戻る</button><button class="menu" data-k="m">メニュー</button><button class="talk" data-k="Space">話す/調べる</button>
</div><div class="hint">画面下のボタンで操作できます</div></div>
<script>
"use strict";
const c=document.getElementById("game"),x=c.getContext("2d");x.imageSmoothingEnabled=false;
let mode="title",px=8,py=6,hp=30,lv=1,gold=120,msg="";
const map=["################"," #..............#".trim(),"#..####........#","#..............#","#....##........#","#....##....C...#","#..............#","#..T...........#","#..............#","#......####....#","#......#.......#","#......#.......#","#..............#","#....####......#","#..............#","################"];
function T(s,a,b,n){x.font=n+"px sans-serif";x.fillStyle="#fff";x.fillText(s,a,b)}
function R(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}
function draw(){
 x.clearRect(0,0,640,400);
 if(mode==="title"){R(0,0,640,400,"#102030");T("勇者の旅路",190,130,42);T("― 第1章 黒騎士の洞窟 ―",150,175,21);T("Aボタンで はじめる",205,260,21);return}
 R(0,0,640,400,"#16251b");const ts=25,ox=120,oy=10;
 for(let y=0;y<map.length;y++)for(let z=0;z<map[y].length;z++){let ch=map[y][z],a=ox+z*ts,b=oy+y*ts;
  if(ch==="#")R(a,b,ts,ts,"#304438");else R(a+1,b+1,ts-2,ts-2,"#1e3927");
  if(ch==="T"){R(a+4,b+7,17,15,"#9b5b32");T("T",a+7,b+20,16)}
  if(ch==="C"){R(a+3,b+3,19,19,"#75602a");T("C",a+7,b+20,16)}
 }
 R(ox+px*ts+5,oy+py*ts+4,15,18,"#e8d3a1");
 R(0,325,640,75,"rgba(0,0,0,.82)");
 T("HP "+hp+"/30   Lv "+lv+"   G "+gold,18,350,18);T(msg||"方向ボタンで移動しよう。",18,378,17);
}
function move(dx,dy){let nx=px+dx,ny=py+dy;if(map[ny]&&map[ny][nx]!=="#"){px=nx;py=ny;msg=""}else msg="壁がある。";if(Math.random()<.12){msg="モンスターが現れた！";hp=Math.max(1,hp-3)}draw()}
function act(k){
 if(mode==="title"){if(k==="Enter"||k==="Space"){mode="map";msg="勇者の旅が始まった！";draw()}return}
 if(k==="ArrowUp")move(0,-1);else if(k==="ArrowDown")move(0,1);else if(k==="ArrowLeft")move(-1,0);else if(k==="ArrowRight")move(1,0);
 else if(k==="m")msg="メニュー：レベル "+lv+"　所持金 "+gold+"G";
 else if(k==="Space")msg="周囲を調べた。";
 else if(k==="Enter")msg="Aで決定。";
 else if(k==="Escape")msg="戻った。";
 draw()
}
document.querySelectorAll("button").forEach(b=>b.onclick=()=>act(b.dataset.k));
addEventListener("keydown",e=>{let k=e.key===" "?"Space":e.key;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter","Escape"].includes(k))e.preventDefault();act(k)});
draw();
</script></body></html>
